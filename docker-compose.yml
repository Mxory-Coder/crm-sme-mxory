version: '3.9'

services:
  # ─── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sme_postgres
    environment:
      POSTGRES_DB: smeconnect
      POSTGRES_USER: smeconnect
      POSTGRES_PASSWORD: smeconnect_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smeconnect']
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sme_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── MinIO (S3-compatible file storage) ─────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: sme_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: smeconnect
      MINIO_ROOT_PASSWORD: smeconnect_dev
    ports:
      - '9000:9000' # API
      - '9001:9001' # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── BullMQ Dashboard ───────────────────────────────────────────────────────
  bullboard:
    image: deadly0/bull-board:latest
    container_name: sme_bullboard
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '3002:3000'
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
  minio_data:
